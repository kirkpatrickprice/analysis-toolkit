name: Publish to PyPI

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:  # Allow manual emergency publishes

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Verify tag matches package version
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        TAG_VERSION="${GITHUB_REF_NAME#v}"
        PKG_VERSION=$(python3 -c "import re; m = re.search(r'__version__\s*=\s*[\"\'](.*?)[\"\']', open('src/kp_analysis_toolkit/__init__.py').read()); print(m.group(1))")
        if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
          echo "ERROR: Tag $GITHUB_REF_NAME does not match package version $PKG_VERSION"
          exit 1
        fi
        echo "Version verified: $PKG_VERSION"

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.14'

    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true

    - name: Install dependencies
      run: |
        uv sync

    - name: Build package
      run: |
        uv build

    - name: Verify build
      run: |
        ls -la dist/
        if [ ! -f dist/*.whl ] || [ ! -f dist/*.tar.gz ]; then
          echo "ERROR: Build artifacts missing"
          exit 1
        fi

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        password: ${{ secrets.PYPI_API_TOKEN }}
        verbose: true

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      continue-on-error: true  # release failure shouldn't block docs deploy
      with:
        tag_name: ${{ github.ref_name }}
        name: Release ${{ github.ref_name }}
        body: |
          ## Installation

          ```bash
          uv tool update kp-analysis-toolkit
          ```

          Or for new installations:
          ```bash
          uv tool install kp-analysis-toolkit
          ```
        draft: false
        prerelease: false
